name: Chromatic Visual Tests

on:
  pull_request:

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history lets Chromatic detect which stories changed

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npx ng run ui-components:build-storybook

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static
          # Exit with non-zero code when there are unaccepted visual changes,
          # which causes this GitHub Actions job to fail and blocks the PR.
          exitZeroOnChanges: true
          # Do not exit immediately after upload — wait for the review verdict.
          exitOnceUploaded: true
